<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://api.github.com; manifest-src 'self'; worker-src 'self'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1E3A31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сейф">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E3A31'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23C9A04C' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23C9A04C'/%3E%3Cpath d='M16 3v6' stroke='%23C9A04C' stroke-width='2.5'/%3E%3C/svg%3E">
<title>Сейф</title>
<style>
:root{
  --enamel:#1E3A31;--enamel-2:#29493E;--enamel-line:rgba(220,230,223,.13);--enamel-ink:#DCE6DF;--enamel-dim:#9AB2A6;
  --plate:#EAD9B1;--brass:#B4893A;--brass-ink:#1C1406;
  --paper:#ECEFE9;--sheet:#F9FAF7;--ink:#17211D;--ink-2:#56635C;--rule:#CCD3CB;--rule-2:#E2E7E0;--hover:#E3E8E1;
  --tint:#F4EBD3;--mark:#F1DFA6;
  --seal:#A2372C;--ok:#2E6A4E;--warn:#8A611C;
  --f-ui:"Bahnschrift","DIN Alternate","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-code:"Cascadia Mono","Cascadia Code",Consolas,"Roboto Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --enamel:#0F221C;--enamel-2:#193329;--enamel-ink:#D3DFD7;--enamel-dim:#86A094;
  --brass:#CBA14E;
  --paper:#121A17;--sheet:#19231F;--ink:#E0E6E1;--ink-2:#9AA89F;--rule:#2E3B35;--rule-2:#232E29;--hover:#22302A;
  --tint:#2C2617;--mark:#5C4B1D;
  --seal:#E07A6A;--ok:#74B993;--warn:#D9B266;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
body.opening{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- вход ---------- */
.lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:40px 20px;overflow:auto;background:#0C1915;color:#EEF3F0;isolation:isolate;font-family:"Segoe UI Variable Display","Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
.aurora{position:fixed;inset:-25%;z-index:-2;filter:blur(64px);pointer-events:none}
.aurora i{position:absolute;border-radius:50%;animation:drift 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:58vmax;height:58vmax;left:6%;top:4%;background:radial-gradient(circle,rgba(40,140,108,1),transparent 66%)}
.aurora i:nth-child(2){width:44vmax;height:44vmax;right:6%;top:26%;background:radial-gradient(circle,rgba(222,174,84,.8),transparent 64%);animation-duration:17s;animation-delay:-6s}
.aurora i:nth-child(3){width:52vmax;height:52vmax;left:26%;bottom:-6%;background:radial-gradient(circle,rgba(40,138,150,.9),transparent 64%);animation-duration:21s;animation-delay:-11s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(9vmax,-6vmax) scale(1.16)}66%{transform:translate(-4vmax,7vmax) scale(.92)}100%{transform:translate(-8vmax,-3vmax) scale(1.08)}}
.lock::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(80% 65% at 50% 45%,rgba(12,25,21,.35),rgba(8,17,14,.5));pointer-events:none}
html:has(body.opening){overflow:hidden}
.door{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.door.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.mark{position:relative;width:72px;height:72px;margin-bottom:24px;border-radius:50%;display:grid;place-items:center;color:#F2D58F;
  background:linear-gradient(150deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .35s,color .35s}
.mark svg{width:30px;height:30px}
.mark::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(242,213,143,.45);opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s}
.lock.focus .mark::before{opacity:1;transform:none}
.mark::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:#F2D58F;border-right-color:rgba(242,213,143,.35);opacity:0;transition:opacity .2s}
.lock.busy .mark::after{opacity:1;animation:spin .9s linear infinite}
.lock.busy .mark::before{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.mark.tick{animation:tick .22s ease}
@keyframes tick{50%{transform:scale(1.07)}}
.mark.done{background:linear-gradient(145deg,#F6DE9E,#C9A04C);color:#1C1406;transform:scale(1.08);border-color:transparent}
.lock-title{margin:0;font-size:30px;line-height:1.15;font-weight:650;letter-spacing:-.015em;color:#F6F8F7}
.lock-sub{margin:8px 0 26px;font-size:15px;line-height:1.5;color:rgba(238,243,240,.66);max-width:32ch}
.lock-form{width:100%;display:grid;gap:10px}
.inp{position:relative}
.inp input{width:100%;height:52px;padding:0 50px 0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#F6F8F7;font:inherit;font-size:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s,background .2s,box-shadow .2s}
.inp input:not([type="password"]):not(#tok){padding-right:16px}
.inp input::placeholder{color:rgba(238,243,240,.42)}
.inp input:focus{outline:none;border-color:rgba(242,213,143,.65);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(242,213,143,.13)}
.inp .eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:10px;background:none;color:rgba(238,243,240,.5);display:grid;place-items:center}
.inp .eye:hover{color:#F6F8F7;background:rgba(255,255,255,.07)}
.inp .eye svg{width:19px;height:19px}
.go{height:52px;margin-top:4px;border:0;border-radius:14px;background:linear-gradient(135deg,#F4DA97,#C9A04C);color:#1C1406;font:inherit;font-size:16px;font-weight:650;box-shadow:0 10px 26px rgba(201,160,76,.3);transition:transform .15s,box-shadow .2s,filter .2s}
.go:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(201,160,76,.4)}
.go:active{transform:translateY(1px)}
.go:disabled{filter:saturate(.55) brightness(.92);cursor:progress;transform:none}
.lock-hint{margin:0;min-height:1.45em;font-size:14px;line-height:1.45;color:#FFB3A2}
.lock-hint:empty{min-height:0}
.lock-hint.ok{color:rgba(238,243,240,.72)}
.lock-foot{margin:24px 0 0;font-size:13px;line-height:1.55;color:rgba(238,243,240,.5);max-width:34ch}
.lock-link{border:0;background:none;padding:2px;color:rgba(242,213,143,.85);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lock-link:hover{color:#F6DE9E}
.repo-line{margin:0 0 2px;font-size:13.5px;color:rgba(238,243,240,.6)}
.file-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 6px 6px 16px;border-radius:14px;border:1px dashed rgba(255,255,255,.22);color:rgba(238,243,240,.72);font-size:14px;text-align:left}
.file-pick span{overflow:hidden;text-overflow:ellipsis}
.file-pick button{flex:none;height:38px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#F6F8F7;font:inherit;font-size:14px}
.file-pick button:hover{background:rgba(255,255,255,.16)}
.lock.leaving{animation:leave .55s cubic-bezier(.4,0,.2,1) forwards}
@keyframes leave{to{opacity:0;transform:scale(1.05);filter:blur(8px)}}

/* ---------- каркас ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main";min-height:100vh}
.side{grid-area:side;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;background:var(--enamel);color:var(--enamel-ink)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 10px;font-size:23px;font-weight:600;font-stretch:87.5%;letter-spacing:.02em;color:var(--plate)}
.brand svg{width:24px;height:24px;color:#C9A04C}
.nav{flex:1;padding-bottom:12px}
.nav-label{margin:18px 20px 4px;font-size:12.5px;color:var(--enamel-dim)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 20px 6px 17px;border-left:3px solid transparent;text-decoration:none;color:var(--enamel-ink)}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.08);border-left-color:#C9A04C;color:#fff}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--enamel-dim);font-variant-numeric:tabular-nums;flex:none}
.nav .count svg{width:13px;height:13px}
.nav .add{display:flex;align-items:center;gap:6px;margin:6px 20px 0;padding:4px 0;border:0;background:none;color:var(--enamel-dim);font-size:14px}
.nav .add:hover{color:var(--enamel-ink)}
.nav .add svg{width:15px;height:15px}
.side-foot{padding:14px 20px 20px;border-top:1px solid var(--enamel-line)}
.side-btn{width:100%;margin-bottom:8px;padding:9px 12px;border-radius:7px;border:1px solid rgba(234,217,177,.35);background:rgba(234,217,177,.07);color:var(--plate);font-weight:500;text-align:left}
.side-btn:hover{background:rgba(234,217,177,.14)}
.side-note{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--enamel-dim)}
.scrim{display:none}

.top{grid-area:top;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 32px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.search{flex:1 1 220px;min-width:160px;max-width:440px;position:relative}
.search input{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet);font-size:15px}
.search input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.is-dirty,.status.is-saving{color:var(--warn)}
.status.is-dirty::before,.status.is-saving::before{background:var(--brass)}
.status.is-saving::before{animation:pulse 1s ease-in-out infinite}
.status.is-off,.status.is-err{color:var(--seal)}
.status.is-off::before,.status.is-err::before{background:var(--seal)}
@keyframes pulse{50%{opacity:.3}}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:280px;padding:6px;border-radius:9px;border:1px solid var(--rule);background:var(--sheet);box-shadow:0 14px 40px rgba(10,25,20,.18)}
.menu button,.menu .menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left;font-size:14.5px}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--rule-2);margin:5px 4px}
.menu select{padding:3px 6px;border-radius:5px;border:1px solid var(--rule);background:var(--paper)}
.menu .danger{color:var(--seal)}

main{grid-area:main;width:100%;max-width:1060px;padding:30px 32px 96px}
main:focus{outline:none}

/* ---------- элементы ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet);font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--seal)}
.btn.danger:hover{background:color-mix(in srgb,var(--seal) 10%,transparent);color:var(--seal)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.6;cursor:progress}
select.btn{padding-right:28px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border:0;border-radius:7px;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:17px;height:17px}
.only-narrow{display:none}
.mono{font-family:var(--f-code);font-size:.92em}
.none{color:var(--ink-2);opacity:.8}
.empty{margin:0;color:var(--ink-2)}
.empty.pad{padding:12px 16px}

.h1,.title-input{margin:0;font-size:34px;line-height:1.15;font-weight:600;font-stretch:87.5%;letter-spacing:.005em}
.lede{margin:8px 0 0;color:var(--ink-2);font-size:16px;max-width:68ch}
.view-head{margin:0 0 26px}
.title-input{display:block;width:100%;padding:2px 0;border:0;border-bottom:1px dashed transparent;background:transparent}
.title-input:hover{border-bottom-color:var(--rule)}
.title-input:focus{outline:none;border-bottom-color:var(--brass)}
.title-input.small{font-size:22px}
textarea{resize:vertical}
textarea.auto{overflow:hidden;resize:none}
.about{display:block;width:100%;max-width:68ch;margin-top:8px;padding:4px 8px;margin-left:-8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink-2);font-size:16px;line-height:1.5}
.about:hover{border-color:var(--rule)}
.about:focus{outline:none;border-color:var(--brass);background:var(--sheet);color:var(--ink)}
.field{width:100%;min-width:0;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent;line-height:1.45}
.field:hover{border-color:var(--rule)}
.field:focus{outline:none;border-color:var(--brass);background:var(--sheet)}
.field.strong{font-weight:600}
select.field{border-color:var(--rule-2);background:var(--sheet)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 22px;margin:20px 0 0;max-width:780px}
.facts dt{padding-top:6px;color:var(--ink-2);font-size:14px}
.facts dd{margin:0 0 0 -8px;min-width:0}
.with-act{display:flex;align-items:center;gap:2px}
.with-act>.val{padding:5px 8px}

.block{margin-top:38px;padding-top:18px;border-top:1px solid var(--rule)}
.block-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px}
.block-head h2{margin:0;font-size:20px;font-weight:600;font-stretch:87.5%}
.head-acts{display:flex;flex-wrap:wrap;gap:4px}
.h3{margin:22px 0 8px;font-size:16px;font-weight:600}

.rows{display:grid;gap:2px}
.row{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) auto;align-items:center;gap:6px}
.row-acts{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);text-decoration:none;font-size:14px}
a.chip{padding:3px 12px}
a.chip:hover{border-color:var(--ink-2)}
.chip .ib{width:26px;height:26px}
.chip .ib svg{width:14px;height:14px}

/* .env */
.env{margin:0 0 14px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);overflow:hidden}
.env.is-example{background:transparent;border-style:dashed}
.env-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--rule-2)}
.env-file{font-family:var(--f-code);font-size:14.5px;font-weight:600}
.env-meta{color:var(--ink-2);font-size:13.5px}
.env-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv th{width:1%;padding:6px 18px 6px 16px;text-align:left;vertical-align:top;white-space:nowrap;font:500 13.5px/1.6 var(--f-code)}
.kv td{padding:6px 8px;vertical-align:top}
.kv tr+tr>*{border-top:1px solid var(--rule-2)}
.kv td.acts{width:1%;white-space:nowrap;padding:1px 6px;text-align:right}
.val{font:13.5px/1.6 var(--f-code);word-break:break-all;white-space:pre-wrap}
.val.masked{letter-spacing:.18em;color:var(--ink-2)}
.code-edit{display:block;width:100%;min-height:140px;padding:12px 16px;border:0;border-bottom:1px solid var(--rule-2);background:var(--sheet);font:13.5px/1.6 var(--f-code);white-space:pre;overflow-x:auto}
.code-edit:focus{outline:none;box-shadow:inset 0 0 0 2px var(--brass)}
.env-rename{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 16px;font-size:13.5px;color:var(--ink-2)}
.env-rename label{display:flex;align-items:center;gap:6px}
.env-rename .field{width:220px;border-color:var(--rule);font-family:var(--f-code);font-size:13.5px;color:var(--ink)}
.dropzone{padding:18px;border:1.5px dashed var(--rule);border-radius:9px;color:var(--ink-2)}
main.drag .dropzone,main.drag .env{border-color:var(--brass)}

/* записи */
.secret{display:grid;grid-template-columns:minmax(160px,1.1fr) minmax(0,1.4fr) minmax(120px,.8fr) minmax(0,1fr) auto;align-items:start;gap:6px;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.secret .with-act{align-items:flex-start}
.secret-head{display:grid;grid-template-columns:minmax(160px,1.1fr) minmax(0,1.4fr) minmax(120px,.8fr) minmax(0,1fr) 34px;gap:6px;padding:0 8px 6px;color:var(--ink-2);font-size:13px;border-bottom:1px solid var(--rule)}
.srv{padding:22px 0;border-bottom:1px solid var(--rule)}
.srv:first-of-type{padding-top:4px}
.danger-zone{margin-top:28px}
.srv .danger-zone{margin-top:10px}

/* таблицы */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px;background:var(--sheet)}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px}
.ledger th{padding:10px 14px;text-align:left;font-weight:500;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule);white-space:nowrap}
.ledger td{padding:11px 14px;vertical-align:top;border-top:1px solid var(--rule-2)}
.ledger tbody tr:first-child td{border-top:0}
.ledger tr[data-act]{cursor:pointer}
.ledger tr[data-act]:hover td{background:var(--hover)}
.ledger tr[data-act]:focus-visible{outline-offset:-2px}
.ledger .sub{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;margin-top:2px;color:var(--ink-2);font-size:13.5px;line-height:1.4;max-width:40ch;overflow:hidden}
.ledger .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger a{text-decoration-color:var(--rule);text-underline-offset:3px}
.ledger a:hover{text-decoration-color:currentColor}
@media (max-width:1180px){.ledger .col-srv{display:none}}

.callout{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 24px;margin:0 0 26px;padding:18px 20px;border-radius:9px;background:var(--tint)}
.callout h2{margin:0 0 4px;font-size:18px;font-weight:600}
.callout p{margin:0;max-width:62ch;color:var(--ink-2)}
.banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;margin:0 0 26px;padding:14px 18px;border-radius:9px;border:1px solid var(--brass);background:var(--tint)}
.banner p{margin:0;max-width:70ch}

/* документы */
.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.docs a{font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.docs a:hover{text-decoration:underline;text-underline-offset:3px}
.doc-meta{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.crumbs{margin-bottom:10px;font-size:14px;color:var(--ink-2)}
.crumbs a{text-underline-offset:3px}
.doc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.doc-head .h1,.doc-head .title-input{flex:1;min-width:200px;overflow-wrap:anywhere}
.doc-edit{min-height:60vh;border:1px solid var(--rule);border-radius:9px;margin-top:18px;white-space:pre-wrap}
.notes{display:block;width:100%;min-height:110px;padding:12px 14px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);line-height:1.55}
.notes:focus{outline:none;border-color:var(--brass)}
.md{max-width:74ch;margin-top:22px;font-size:15.5px;line-height:1.62;overflow-wrap:anywhere}
.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.6em 0 .5em;line-height:1.25;font-weight:600}
.md h2{font-size:24px;font-stretch:87.5%}
.md h3{font-size:19px}
.md h4,.md h5,.md h6{font-size:16px}
.md>:first-child{margin-top:0}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .md-table{margin:0 0 1em}
.md ul,.md ol{padding-left:1.4em}
.md li+li{margin-top:.25em}
.md code{padding:.1em .35em;border-radius:4px;background:var(--rule-2);font:.88em var(--f-code)}
.md pre{padding:12px 14px;border-radius:8px;background:var(--rule-2);overflow-x:auto}
.md pre code{padding:0;background:none;font-size:13px;line-height:1.55}
.md blockquote{padding:2px 0 2px 14px;border-left:3px solid var(--brass);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
.md .md-table{overflow-x:auto}
.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{padding:6px 10px;border:1px solid var(--rule);text-align:left;vertical-align:top}
.md th{background:var(--rule-2);font-weight:600}
.md a{text-underline-offset:3px}

/* поиск */
.results{list-style:none;margin:0;padding:0}
.results li{border-bottom:1px solid var(--rule-2)}
.results a{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 16px;padding:10px 4px;text-decoration:none}
.results a:hover{background:var(--hover)}
.results .kind{color:var(--ink-2);font-size:13.5px;padding-top:1px}
.results .t{font-weight:600}
.results .s{grid-column:2;color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* диалоги */
dialog.dlg{width:min(680px,calc(100% - 24px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:12px;background:var(--sheet);color:var(--ink);box-shadow:0 24px 70px rgba(5,15,12,.4)}
dialog.dlg::backdrop{background:rgba(8,20,16,.55)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg-head{padding:20px 22px 12px}
.dlg-head h2{margin:0;font-size:21px;font-weight:600;font-stretch:87.5%}
.dlg-head p{margin:6px 0 0;color:var(--ink-2)}
.dlg-body{padding:4px 22px 12px;overflow:auto}
.dlg-body p{margin:0 0 .8em}
.dlg-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 22px 18px;border-top:1px solid var(--rule-2)}
.dlg-body label.fld{display:grid;gap:4px;margin-bottom:12px;font-size:14px;color:var(--ink-2)}
.dlg-body label.fld input{padding:9px 12px;border-radius:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-size:15px}
.dlg-body label.fld input:focus{outline:none;border-color:var(--brass)}
.dlg-err{min-height:1.4em;color:var(--seal);font-size:14px;margin:0}
.link-box{width:100%;min-height:96px;padding:10px 12px;border-radius:7px;border:1px solid var(--rule);background:var(--paper);font:12.5px/1.5 var(--f-code);word-break:break-all;resize:none}
.imp-group{margin:0 0 16px;padding:0;border:0}
.imp-group legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;width:100%;padding:0 0 6px;font-weight:600}
.imp-group legend span{font-weight:400;color:var(--ink-2);font-size:14px}
.imp-group select{padding:4px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);font-size:14px}
.imp-item{display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:5px 2px;border-top:1px solid var(--rule-2);font-size:14px}
.imp-item .k{color:var(--ink-2);font-size:12.5px}
.imp-item .p{font-family:var(--f-code);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tag.new{color:var(--ok)}
.tag.upd{color:var(--warn)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-2)}
.hist pre{margin:8px 0 0;padding:10px;border-radius:7px;background:var(--rule-2);font:12.5px/1.5 var(--f-code);white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;max-width:calc(100% - 32px);padding:10px 16px;border-radius:9px;background:var(--enamel);color:var(--plate);font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- узкие экраны ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:30;width:min(290px,86vw);height:auto;transform:translateX(-102%);transition:transform .22s ease}
  .shell.side-open .side{transform:none}
  .shell.side-open .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(8,20,16,.45)}
  .only-narrow{display:inline-grid}
  .hide-narrow{display:none}
  .top{flex-wrap:wrap;padding:10px 12px;gap:6px}
  .status{font-size:0;gap:0;padding:0 6px}
  .search{order:5;flex-basis:100%;max-width:none}
  main{padding:22px 16px 80px}
  .h1,.title-input{font-size:28px}
  .facts{grid-template-columns:minmax(0,1fr);gap:0}
  .facts dt{padding-top:10px}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .field:nth-child(2){grid-column:1/-1;grid-row:2}
  .secret,.secret-head{grid-template-columns:minmax(0,1fr) auto}
  .secret-head{display:none}
  .secret>*:not(.ib){grid-column:1}
  .secret>.ib{grid-column:2;grid-row:1}
  .kv,.kv tbody,.kv tr{display:block}
  .kv tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
  .kv th{width:auto;padding:2px 16px 0;white-space:normal;word-break:break-all}
  .kv td{padding:0 16px}
  .kv td.acts{grid-column:2;grid-row:1/3;align-self:center;width:auto;padding:0 6px}
  .kv tr+tr>*{border-top:0}
  .kv tr+tr{border-top:1px solid var(--rule-2)}
  .results a{grid-template-columns:minmax(0,1fr)}
  .results .s{grid-column:1}
  .imp-item{grid-template-columns:20px 40px minmax(0,1fr) auto}
  .imp-item .size{display:none}
  .docs li{flex-wrap:wrap;gap:2px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';

const ITER = 600000;
const VAULT_PATH = 'vault.json';
const CFG_KEY = 'seyf.cfg', CACHE_KEY = 'seyf.cache', PENDING_KEY = 'seyf.pending';
const te = new TextEncoder(), td = new TextDecoder();
const AAD = te.encode('seyf/1'), AAD_TOK = te.encode('seyf/tok');
const HAS_DIR = typeof window.showDirectoryPicker === 'function';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(6))].map(x => x.toString(36).padStart(2, '0')).join('').slice(0, 10);
const nowIso = () => new Date().toISOString();

const S = {
  cfg: null,          // {repo, path, tok} — хранится на устройстве; tok — ключ GitHub, зашифрованный мастер-паролем
  token: null,        // ключ GitHub в памяти, пока сейф открыт
  remote: undefined,  // {env, sha} — что лежит в репозитории (загружено на экране замка)
  importEnv: null,    // данные из файла для первого создания
  sha: null,          // версия файла в репозитории, от которой мы отталкиваемся
  key: null, salt: null, iter: ITER, check: null,
  data: null, dirty: false, ver: 0, saving: false, again: false, offline: false, saveErr: '',
  autoT: null, stashT: null, lastSync: 0,
  reveal: new Set(), editEnv: new Set(), envSnap: {}, editDoc: null,
  query: '', lockMode: 'open', dial: 0, lastAct: Date.now()
};

/* ===== иконки ===== */
const ic = {
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.1Q11.3 5 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/>',
  download:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  history:'<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/><path d="M12 7.5V12l3 2"/>'
};
const I = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;
const ib = (icon, label, attrs = '') => `<button type="button" class="ib" title="${esc(label)}" aria-label="${esc(label)}" ${attrs}>${I(icon)}</button>`;

/* ===== форматирование ===== */
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }
const nw = (n, a, b, c) => `${n} ${plural(n, a, b, c)}`;
function fmtDay(iso) { try { return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}).replace(' г.', ''); } catch { return ''; } }
function fmtTime(iso) { try { return fmtDay(iso) + ', ' + new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); } catch { return ''; } }
function fmtSize(n) { if (n < 1024) return n + ' Б'; if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0).replace('.', ',') + ' КБ'; return (n / 1048576).toFixed(1).replace('.', ',') + ' МБ'; }
const byteLen = s => te.encode(s || '').length;
function stamp() { const d = new Date(), p = x => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}`; }
function deviceName() { const u = navigator.userAgent; return /iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'устройство'; }

/* ===== шифрование ===== */
function b64(buf) { const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
const b64url = u8 => b64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function pipeBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function seal(data) {
  const json = te.encode(JSON.stringify(data));
  let z = 'none', body = json;
  if (typeof CompressionStream === 'function') { body = await pipeBytes(json, new CompressionStream('gzip')); z = 'gzip'; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:AAD}, S.key, body);
  return {format:'seyf', v:1, kdf:{name:'PBKDF2', hash:'SHA-256', iterations:S.iter, salt:b64(S.salt)}, cipher:'AES-256-GCM', z, iv:b64(iv), ct:b64(ct), savedAt:nowIso()};
}
async function openWithKey(env, key) {
  let plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(env.iv), additionalData:AAD}, key, unb64(env.ct)));
  if (env.z === 'gzip') plain = await pipeBytes(plain, new DecompressionStream('gzip'));
  return JSON.parse(td.decode(plain));
}
const envKey = (env, pass) => deriveKey(pass, unb64(env.kdf.salt), env.kdf.iterations);
async function encTok(text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:AAD_TOK}, S.key, te.encode(text)); return {s:b64(S.salt), i:S.iter, iv:b64(iv), ct:b64(ct)}; }
async function decTok(o, key) { return td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv), additionalData:AAD_TOK}, key, unb64(o.ct))); }
async function makeCheck() { const iv = crypto.getRandomValues(new Uint8Array(12)); S.check = {iv, ct: await crypto.subtle.encrypt({name:'AES-GCM', iv}, S.key, te.encode('seyf-ok'))}; }
async function passMatches(pass) {
  try { const k = await deriveKey(pass, S.salt, S.iter); await crypto.subtle.decrypt({name:'AES-GCM', iv:S.check.iv}, k, S.check.ct); return true; } catch { return false; }
}

/* ===== хранилище на устройстве ===== */
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function defaultRepo() { const h = location.hostname; return /\.github\.io$/i.test(h) ? h.split('.')[0] + '/seyf-data' : ''; }

/* ===== GitHub ===== */
class GhError extends Error { constructor(kind, status) { super(kind); this.kind = kind; this.status = status; } }
async function gh(method, url, body) {
  let r;
  try {
    r = await fetch('https://api.github.com' + url, {method, cache:'no-store', headers: Object.assign({'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + S.token, 'X-GitHub-Api-Version':'2022-11-28'}, body ? {'Content-Type':'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  } catch { throw new GhError('net'); }
  return r;
}
const repoUrl = () => `/repos/${S.cfg.repo.split('/').map(encodeURIComponent).join('/')}`;
const fileUrl = () => `${repoUrl()}/contents/${encodeURIComponent(S.cfg.path || VAULT_PATH)}`;
async function ghCheckRepo() {
  const r = await gh('GET', repoUrl());
  if (r.status === 401) throw new GhError('auth', 401);
  if (r.status === 403 || r.status === 404) throw new GhError('perm', r.status);
  if (!r.ok) throw new GhError('http', r.status);
}
async function ghLoad() {
  const r = await gh('GET', fileUrl());
  if (r.status === 404) return {env:null, sha:null};
  if (r.status === 401) throw new GhError('auth', 401);
  if (r.status === 403) throw new GhError('perm', 403);
  if (!r.ok) throw new GhError('http', r.status);
  const j = await r.json();
  let content = j.content;
  if (!content || j.encoding !== 'base64') {
    const rb = await gh('GET', `${repoUrl()}/git/blobs/${j.sha}`);
    if (!rb.ok) throw new GhError('http', rb.status);
    content = (await rb.json()).content;
  }
  return {env: JSON.parse(td.decode(unb64(content.replace(/\s/g, '')))), sha: j.sha};
}
async function ghSave(env, sha) {
  const body = {message:`Сейф: сохранение (${deviceName()})`, content: b64(te.encode(JSON.stringify(env)))};
  if (sha) body.sha = sha;
  const r = await gh('PUT', fileUrl(), body);
  if (r.status === 409 || r.status === 422) throw new GhError('conflict', r.status);
  if (r.status === 401) throw new GhError('auth', 401);
  if (r.status === 403 || r.status === 404) throw new GhError('perm', r.status);
  if (!r.ok) throw new GhError('http', r.status);
  return (await r.json()).content.sha;
}
function ghMessage(e) {
  const repo = S.cfg ? S.cfg.repo : 'репозиторий';
  switch (e && e.kind) {
    case 'net': return 'Нет связи с GitHub. Проверьте интернет.';
    case 'auth': return 'GitHub не принял ключ доступа: он неверный или у него закончился срок. Создайте новый и подключитесь заново.';
    case 'perm': return `Ключ не даёт доступа к ${repo}. При создании ключа выберите этот репозиторий и право Contents: Read and write.`;
    case 'conflict': return 'На другом устройстве сохранили более новую версию.';
    case 'http': return `GitHub ответил ошибкой ${e.status}. Попробуйте ещё раз через минуту.`;
    default: return 'Ошибка: ' + (e && e.message || e);
  }
}

/* ===== данные ===== */
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  for (const k of ['projects', 'servers', 'secrets']) if (!Array.isArray(d[k])) d[k] = [];
  d.settings = Object.assign({autolock:10}, d.settings || {});
  d.meta = Object.assign({createdAt:nowIso()}, d.meta || {});
  for (const p of d.projects) {
    p.id ||= uid();
    for (const k of ['name', 'about', 'folder', 'repo', 'stack', 'notes']) p[k] ??= '';
    for (const k of ['domains', 'servers', 'envs', 'docs']) if (!Array.isArray(p[k])) p[k] = [];
    for (const x of p.domains) { x.name ??= ''; x.note ??= ''; }
    for (const e of p.envs) { e.id ||= uid(); e.name ??= '.env'; e.path ??= ''; e.content ??= ''; if (!Array.isArray(e.history)) e.history = []; }
    for (const x of p.docs) { x.id ||= uid(); x.name ??= 'Документ.md'; x.path ??= ''; x.content ??= ''; }
  }

function parseEnv(text) {
  const out = [];
  String(text || '').split(/\r?\n/).forEach((line, i) => {
    const m = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_.\-]*)\s*=\s?(.*)$/);

/* ===== markdown (безопасное подмножество) ===== */
function inline(s) {
  return String(s).split(/(`[^`]+`)/).map(part => {
    if (/^`[^`]+`$/.test(part)) return '<code>' + esc(part.slice(1, -1)) + '</code>';
    let t = esc(part);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    t = t.replace(/\[([^\]]+)\]\(([^)]*)\)/g, '$1');
    return t;
  }).join('');
}
function md(src) {
  const L = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isBlock = l => /^\s*(```|#{1,6}\s|>)/.test(l) || isList(l) || isTable(l);
  let out = '', i = 0;
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^\s*```/.test(l)) { const buf = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]); i++; out += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { const n = Math.min(6, m[1].length + 1); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (isTable(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const row = s => s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < L.length && isTable(L[i])) body.push(row(L[i++]));
      out += `<div class="md-table"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if (/^\s*>/.test(l)) { const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, '')); out += `<blockquote>${md(buf.join('\n'))}</blockquote>`; continue; }
    if (isList(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < L.length && (isList(L[i]) || (items.length && /^\s{2,}\S/.test(L[i])))) {
        if (isList(L[i])) items.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/, '')); else items[items.length - 1] += ' ' + L[i].trim();
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out += `<${tag}>${items.map(t => `<li>${inline(t.replace(/^\[( |x|X)\]\s*/, (_, c) => c.trim() ? '☑ ' : '☐ '))}</li>`).join('')}</${tag}>`;
      continue;
    }
    const buf = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !isBlock(L[i])) buf.push(L[i++]);
    if (!buf.length) buf.push(L[i++]);
    out += `<p>${buf.map(inline).join(' ')}</p>`;
  }
  return out;
}

function viewSearch(q) {

  for (const p of S.data.projects) {
    if (has(p.name) || has(p.about) || has(p.folder) || has(p.repo) || has(p.stack)) res.push(['Проект', p.name, esc(p.about), `#/p/${p.id}`]);
    for (const x of p.domains) if (has(x.name) || has(x.note)) res.push(['Домен', x.name, esc(p.name), `#/p/${p.id}`]);
    for (const e of p.envs) for (const kv of parseEnv(e.content)) {

      else if (deep && has(kv.v)) res.push(['Значение в .env', kv.k, esc(`${p.name}, ${e.path || e.name}`), `#/p/${p.id}`]);

    for (const x of p.docs) if (has(x.name) || has(x.content)) res.push(['Документ', x.name, esc(p.name) + (has(x.content) ? ': ' + snip(x.content) : ''), `#/d/${p.id}/${x.id}`]);
    if (has(p.notes)) res.push(['Заметка', p.name, snip(p.notes), `#/p/${p.id}`]);

  for (const s of S.data.servers) {

/* ===== загрузка из папки и файлов ===== */
const SKIP = new Set(['node_modules', 'Library', 'Temp', 'Logs', 'obj', 'bin', 'Builds', 'Build', 'Assets', 'Packages', 'ProjectSettings', 'UserSettings', 'venv', '__pycache__', 'dist', 'build', 'coverage', 'RawModels', 'intro', 'vendor', 'storage', 'target', 'out']);
const isEnvName = n => n === '.env' || /^\.env\./i.test(n) || /\.env$/i.test(n);
const isExample = n => /(example|sample|template|dist)/i.test(n);
async function walk(dir, prefix, depth, out) {
  for await (const [name, h] of dir.entries()) {
    const path = prefix ? prefix + '/' + name : name;
    if (h.kind === 'directory') { if (depth < 4 && !SKIP.has(name) && !name.startsWith('.')) await walk(h, path, depth + 1, out); continue; }
    const env = isEnvName(name), doc = /\.md$/i.test(name);
    if (!env && !doc) continue;
    const f = await h.getFile(); if (f.size > 2 * 1024 * 1024) continue;
    out.push({kind: env ? 'env' : 'doc', name, path, size: f.size, text: await f.text(), example: env && isExample(name)});
  }
}
async function importFolder() {
  if (!HAS_DIR) { toast('Этот браузер не умеет открывать папки. Добавьте файлы на странице проекта.', 5000); return; }
  let root;
  try { root = await showDirectoryPicker({id: 'seyf-import', mode: 'read'}); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('Папку открыть не удалось: ' + (e && e.message || e)); return; }
  toast('Ищу файлы .env и документы…', 20000);
  try {
    const top = []; for await (const [n, h] of root.entries()) top.push([n, h]);
    const markers = ['.git', 'docker-compose.yml', 'README.md', 'package.json', 'Dockerfile', 'pyproject.toml', 'requirements.txt', 'Assets', 'ProjectSettings'];
    const single = top.some(([n]) => markers.includes(n));
    const groups = single ? [{folder: root.name, dir: root, items: []}]
      : top.filter(([n, h]) => h.kind === 'directory' && !SKIP.has(n) && !n.startsWith('.')).map(([n, h]) => ({folder: n, dir: h, items: []}));
    for (const g of groups) await walk(g.dir, '', 0, g.items);
    const found = groups.filter(g => g.items.length);
    if (found.length) { $('#toast').classList.remove('on'); importDialog(found, root.name); }
    else toast('В этой папке нет файлов .env и документов .md', 4000);
  } catch (e) { toast('Не удалось прочитать папку: ' + (e && e.message || e), 6000); }
}

}

      if (!p) { p = normalize({projects: [{name: g.folder}]}).projects[0]; S.data.projects.push(p); g.pid = p.id; newP++; }
      for (const it of chosen) {
        const r = it.kind === 'env' ? upsertEnv(p, it.name, it.path, it.text, it.example) : upsertDoc(p, it.name, it.path, it.text);
        if (r === 'added') added++; else if (r === 'updated') updated++;
      }
    }
    d.close();
    if (added || updated || newP) { touch(); renderSide(); renderMain(true); }
    toast(added || updated ? `Загружено: ${added} ${plural(added, 'новый файл', 'новых файла', 'новых файлов')}, обновлено ${updated}` : 'Ничего не загружено', 4500);
  });
}
async function addFiles(pid, files) {
  const p = proj(pid); if (!p || !files.length) return;
  let ne = 0, nd = 0;
  for (const f of files) {
    if (f.size > 2 * 1024 * 1024) { toast(`${f.name}: больше 2 МБ, пропущен`); continue; }
    const text = await f.text();
    if (/\.(md|markdown|txt)$/i.test(f.name)) { upsertDoc(p, f.name, f.name, text); nd++; }
    else { upsertEnv(p, f.name, f.name, text, isExample(f.name)); ne++; }
  }
  touch(); renderSide(); renderMain(true);
  toast(`Добавлено: ${nw(ne, 'файл', 'файла', 'файлов')} .env, ${nw(nd, 'документ', 'документа', 'документов')}`);
}
async function restoreFromFile() {
  const f = await pickFile('.json,.html,.htm,application/json,text/html'); if (!f) return;
  const env = envelopeFromText(await f.text());
  if (!env) { toast('В этом файле нет данных Сейфа.', 4500); return; }
  let data;
  if (!env.ct) data = env.seed || {};
  else if (env.kdf.salt === b64(S.salt)) { try { data = await openWithKey(env, S.key); } catch {} }
  if (!data && env.ct) {
    const pw = await askPassword('Пароль от копии', `Файл ${f.name} зашифрован. Введите пароль, с которым он был сохранён.`);
    if (pw === null) return;
    try { data = await openWithKey(env, await envKey(env, pw)); } catch { toast('Пароль не подошёл к этой копии.', 4500); return; }
  }
  if (!confirm(`Заменить всё содержимое сейфа данными из ${f.name}? Текущая версия останется в истории репозитория.`)) return;
  S.data = normalize(data); touch(); go('#/'); renderSide(); toast('Данные восстановлены из копии', 4000);
}

/* ===== меню и боковая панель ===== */
function hideMenu() { const m = $('#menu'); if (m && !m.hidden) { m.hidden = true; $('#menu-btn')?.setAttribute('aria-expanded', 'false'); } }
function toggleMenu() { const m = $('#menu'); if (!m) return; m.hidden = !m.hidden; $('#menu-btn').setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) $('#autolock').value = String(S.data.settings.autolock); }
function closeSide() { $('#shell')?.classList.remove('side-open'); }

/* ===== действия ===== */
async function act(t) {
  const a = t.dataset.act, {p: pid, e: eid, i, l, k: kid, s: sid, r: rid} = t.dataset;
  const p = pid && S.data ? proj(pid) : null;
  switch (a) {
    case 'go': go(t.dataset.href); break;
    case 'save': hideMenu(); if (!S.dirty) toast('Всё уже сохранено'); else { S.saveErr = ''; S.offline = false; await save(); } break;
    case 'backup': hideMenu(); download(JSON.stringify(await seal(S.data)), `Сейф-копия-${stamp()}.json`); toast('Копия скачана. Открыть её можно этим же паролем.'); break;
    case 'restore': hideMenu(); await restoreFromFile(); break;
    case 'lock': await lock(); break;
    case 'menu': toggleMenu(); break;
    case 'about': hideMenu(); aboutDialog(); break;
    case 'connect': hideMenu(); closeSide(); await connectDialog(); break;
    case 'change-pass': hideMenu(); passDialog(); break;
    case 'forget':
      hideMenu();
      if (!confirm('Отключить это устройство? Данные останутся в GitHub, но здесь сейф придётся подключать заново.' + (S.dirty ? ' Несохранённые изменения пропадут.' : ''))) return;
      [CFG_KEY, CACHE_KEY, PENDING_KEY].forEach(ls.del);
      S.data = null; S.key = null; S.token = null; S.cfg = null; S.dirty = false; location.hash = '';
      showSetup('Устройство отключено. Чтобы снова открыть сейф, подключите его.');
      break;
    case 'reconnect': S.cfg = S.cfg ? {repo: S.cfg.repo, path: S.cfg.path} : null; showSetup(); break;
    case 'peek': {
      const inp = t.parentElement.querySelector('input'), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; t.innerHTML = I(show ? 'eyeOff' : 'eye');
      t.setAttribute('aria-label', show ? 'Скрыть' : 'Показать'); t.title = show ? 'Скрыть' : 'Показать';
      inp.focus(); break;
    }
    case 'edit-repo': $('#repo-wrap').hidden = false; $('#repo-line')?.remove(); $('#repo').focus(); $('#repo').select(); break;
    case 'pick-import': {
      const f = await pickFile('.html,.htm,.json,text/html,application/json'); if (!f) return;
      const env = envelopeFromText(await f.text());
      if (!env) { lockFail('В этом файле нет данных Сейфа.'); return; }
      env._name = f.name; S.importEnv = env;
      $('#imp-name').textContent = f.name + (env.ct ? ' (зашифрован: введите его пароль)' : '');
      t.textContent = 'Другой файл';
      break;
    }
    case 'import': closeSide(); await importFolder(); break;
    case 'toggle-side': $('#shell').classList.toggle('side-open'); break;
    case 'close-side': closeSide(); break;
    case 'add-project': {
      const np = normalize({projects: [{name: 'Новый проект'}]}).projects[0];
      S.data.projects.push(np); touch(); go(`#/p/${np.id}`);
      setTimeout(() => { const el = $(`[data-bind="p.${np.id}.name"]`); if (el) { el.focus(); el.select(); } }, 30);
      break;
    }
    case 'del-project':
      if (!confirm(`Удалить проект «${p.name}» вместе с его файлами .env и документами? Прошлая версия останется в истории репозитория.`)) return;
      S.data.projects = S.data.projects.filter(x => x !== p);
      S.data.secrets.forEach(k => { if (k.project === p.id) k.project = ''; });
      touch(); go('#/');
      break;
    case 'copy-input': { const inp = t.closest('.with-act').querySelector('input,textarea'); if (inp && inp.value) copy(inp.value); break; }
    case 'open-input': { const v = t.closest('.with-act').querySelector('input').value.trim(); if (/^https?:\/\//i.test(v)) window.open(v, '_blank', 'noopener,noreferrer'); else toast('Здесь нет ссылки, которая начинается с https://'); break; }
    case 'add-domain': p.domains.push({name: '', note: ''}); touch(); renderMain(true); $(`[data-bind="pd.${p.id}.${p.domains.length - 1}.name"]`)?.focus(); break;
    case 'del-domain': p.domains.splice(+i, 1); touch(); renderSide(); renderMain(true); break;
    case 'open-domain': { const n = (p.domains[+i]?.name || '').trim(); if (safeHost(n)) window.open('https://' + n, '_blank', 'noopener,noreferrer'); else toast('Сначала впишите домен'); break; }
    case 'unlink-server': p.servers = p.servers.filter(x => x !== sid); touch(); renderMain(true); break;
    case 'reveal': S.reveal.has(rid) ? S.reveal.delete(rid) : S.reveal.add(rid); renderMain(true); break;
    case 'reveal-all': {
      const e = envOf(pid, eid), ids = parseEnv(e.content).map(x => `e:${e.id}:${x.line}`), all = ids.every(x => S.reveal.has(x));
      ids.forEach(x => all ? S.reveal.delete(x) : S.reveal.add(x)); renderMain(true); break;
    }
    case 'copy-val': { const e = envOf(pid, eid), x = parseEnv(e.content).find(z => z.line === +l); if (x) copy(x.v, `Скопировано значение ${x.k}`); break; }
    case 'copy-env': copy(envOf(pid, eid).content, 'Файл скопирован целиком'); break;
    case 'dl-env': { const e = envOf(pid, eid); download(e.content, e.name || '.env', 'text/plain'); break; }
    case 'edit-env': S.editEnv.add(eid); S.envSnap[eid] = envOf(pid, eid).content; renderMain(true); $(`[data-bind="e.${pid}.${eid}.content"]`)?.focus(); break;
    case 'done-env': {
      const e = envOf(pid, eid); S.editEnv.delete(eid);
      const before = S.envSnap[eid]; delete S.envSnap[eid];
      if (before !== undefined && before !== e.content) { if (before.trim()) { e.history.unshift({content: before, at: e.updatedAt || nowIso()}); e.history.length = Math.min(e.history.length, 5); } e.updatedAt = nowIso(); touch(); }
      renderMain(true); break;
    }
    case 'hist-env': histDialog(p, envOf(pid, eid)); break;
    case 'del-env': { const e = envOf(pid, eid); if (!confirm(`Удалить ${e.path || e.name} из сейфа?`)) return; p.envs = p.envs.filter(x => x !== e); touch(); renderSide(); renderMain(true); break; }
    case 'paste-env': { const e = {id: uid(), name: '.env', path: '', content: '', updatedAt: nowIso(), history: []}; p.envs.push(e); S.editEnv.add(e.id); S.envSnap[e.id] = ''; touch(); renderSide(); renderMain(true); $(`[data-bind="e.${p.id}.${e.id}.content"]`)?.focus(); break; }
    case 'add-files': { const inp = $('#file-in'); inp.dataset.p = pid; inp.value = ''; inp.click(); break; }
    case 'new-doc': { const x = {id: uid(), name: 'Заметка.md', path: '', content: '', updatedAt: nowIso()}; p.docs.push(x); S.editDoc = x.id; touch(); go(`#/d/${p.id}/${x.id}`); break; }
    case 'edit-doc': S.editDoc = t.dataset.doc; renderMain(); $('.doc-edit')?.focus(); break;
    case 'done-doc': { const x = docOf(pid, t.dataset.doc); if (x) x.updatedAt = nowIso(); S.editDoc = null; renderMain(); break; }
    case 'copy-doc': copy(docOf(pid, t.dataset.doc).content, 'Текст документа скопирован'); break;
    case 'dl-doc': { const x = docOf(pid, t.dataset.doc); download(x.content, x.name || 'Документ.md', 'text/markdown'); break; }
    case 'del-doc': { const x = docOf(pid, t.dataset.doc); if (!confirm(`Удалить документ «${x.name}»?`)) return; p.docs = p.docs.filter(z => z !== x); touch(); go(`#/p/${p.id}`); break; }
    case 'add-server': { const s = normalize({servers: [{name: 'Новый сервер'}]}).servers[0]; S.data.servers.push(s); touch(); renderSide(); renderMain(true); const el = $(`[data-bind="s.${s.id}.name"]`); if (el) { el.focus(); el.select(); } break; }
    case 'del-server': { const s = srv(sid); if (!confirm(`Удалить сервер «${s.name || s.address}»? Из проектов он тоже отвяжется.`)) return; S.data.servers = S.data.servers.filter(x => x !== s); S.data.projects.forEach(x => { x.servers = x.servers.filter(y => y !== sid); }); touch(); renderSide(); renderMain(true); break; }
    case 'copy-access': copy(srv(sid).access, 'Доступ скопирован'); break;
    case 'add-secret': { const k = normalize({secrets: [{}]}).secrets[0]; S.data.secrets.push(k); S.reveal.add('k:' + k.id); touch(); renderSide(); renderMain(true); $(`[data-bind="k.${k.id}.title"]`)?.focus(); break; }
    case 'del-secret': { const k = sec(kid); if ((k.title || k.value) && !confirm(`Удалить запись «${k.title || 'без названия'}»?`)) return; S.data.secrets = S.data.secrets.filter(x => x !== k); touch(); renderSide(); renderMain(true); break; }
    case 'copy-secret': copy(sec(kid).value, 'Значение скопировано'); break;
  }
}
function bindSet(key, val) {
  const [t, a, b, c] = key.split('.');
  if (t === 'p') { const p = proj(a); if (p) p[b] = val; }
  else if (t === 'pd') { const p = proj(a); if (p && p.domains[+b]) p.domains[+b][c] = val; }
  else if (t === 's') { const s = srv(a); if (s) s[b] = val; }
  else if (t === 'k') { const s = sec(a); if (s) s[b] = val; }
  else if (t === 'e') { const e = envOf(a, b); if (e) e[c] = val; }
  else if (t === 'doc') { const x = docOf(a, b); if (x) x[c] = val; }
  touch();
}

/* ===== события ===== */
document.addEventListener('click', ev => {
  if (!ev.target.closest('.more')) hideMenu();
  if (ev.target.closest('dialog')) return;
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'A') ev.preventDefault();
  act(t).catch(e => toast('Ошибка: ' + (e && e.message || e), 6000));
});
document.addEventListener('keydown', ev => {
  S.lastAct = Date.now();
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if ((ev.ctrlKey || ev.metaKey) && (ev.code === 'KeyS' || String(ev.key || '').toLowerCase() === 's')) { ev.preventDefault(); if (S.data) { S.saveErr = ''; save(); } return; }
  if (S.data && ((ev.key === '/' && !inField) || ((ev.ctrlKey || ev.metaKey) && ev.code === 'KeyK'))) { ev.preventDefault(); $('#q')?.focus(); return; }
  if (ev.key === 'Escape') { hideMenu(); closeSide(); if (ev.target.id === 'q' && ev.target.value) { ev.target.value = ''; S.query = ''; renderMain(); } }
  if (ev.key === 'Enter' && !inField && ev.target.matches('tr[data-act]')) act(ev.target);
  if (ev.target.id === 'pw' || ev.target.id === 'pw2') {
    const h = $('#lock-hint');
    if (h && ev.getModifierState && ev.getModifierState('CapsLock')) { h.textContent = 'Включён Caps Lock.'; h.className = 'lock-hint ok'; }
    else if (h && h.textContent === 'Включён Caps Lock.') h.textContent = '';
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'lock-form') onLockSubmit();
  if (ev.target.id === 'setup-form') onSetupSubmit();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'pw' || t.id === 'pw2' || t.id === 'tok') { pulseMark(); return; }
  if (t.closest('dialog')) return;
  if (t.id === 'q') { S.query = t.value; renderMain(); return; }
  if (t.dataset.bind && t.tagName !== 'SELECT') {
    bindSet(t.dataset.bind, t.value);
    if (t.classList.contains('auto')) autosize(t);
    if (/^p\.[^.]+\.name$/.test(t.dataset.bind) || /^pd\..+\.name$/.test(t.dataset.bind)) renderSide();
  }
});
document.addEventListener('focusin', ev => { const l = $('#lock'); if (l && l.contains(ev.target) && ev.target.tagName === 'INPUT') l.classList.add('focus'); });
document.addEventListener('focusout', ev => { const l = $('#lock'); if (l && l.contains(ev.target)) setTimeout(() => { if (!l.contains(document.activeElement) || document.activeElement.tagName !== 'INPUT') l.classList.remove('focus'); }, 0); });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.closest('dialog')) return;
  if (t.dataset.bind && t.tagName === 'SELECT') { bindSet(t.dataset.bind, t.value); renderMain(true); return; }
  if (t.dataset.change === 'link-server' && t.value) { const p = proj(t.dataset.p); p.servers.push(t.value); touch(); renderMain(true); renderSide(); return; }
  if (t.dataset.change === 'autolock') { S.data.settings.autolock = +t.value; touch(); toast(+t.value ? `Сейф будет запираться через ${t.selectedOptions[0].textContent} без действий` : 'Автоматически сейф запираться не будет'); return; }
  if (t.id === 'file-in') addFiles(t.dataset.p, [...t.files]);
});
['pointerdown', 'wheel', 'pointermove', 'touchstart'].forEach(n => document.addEventListener(n, () => { S.lastAct = Date.now(); }, {passive: true}));
document.addEventListener('dragover', ev => { if (S.data && route().a === 'p' && ev.dataTransfer?.types?.includes('Files')) { ev.preventDefault(); $('#main')?.classList.add('drag'); } });
document.addEventListener('dragleave', ev => { if (!ev.relatedTarget) $('#main')?.classList.remove('drag'); });
document.addEventListener('drop', ev => {
  if (!S.data) return; ev.preventDefault(); $('#main')?.classList.remove('drag');
  const r = route(); if (r.a !== 'p' || !proj(r.b)) { toast('Перетаскивайте файлы на страницу проекта'); return; }
  addFiles(r.b, [...(ev.dataTransfer?.files || [])]);
});
window.addEventListener('hashchange', () => {
  if (!S.data) return;
  S.query = ''; const q = $('#q'); if (q) q.value = '';
  if (route().a !== 'd') S.editDoc = null;
  closeSide(); renderSide(); renderMain(); scrollTo(0, 0);
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => $$('#main textarea.auto').forEach(autosize), 120); });
document.addEventListener('visibilitychange', () => {
  if (!S.data) return;
  if (document.visibilityState === 'hidden') { if (S.dirty) { stash(); save(); } }
  else syncRemote();
});
window.addEventListener('online', () => { if (S.data && S.dirty) { S.offline = false; save(); } });
window.addEventListener('beforeunload', ev => { if (S.data && S.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
setInterval(() => {
  if (!S.data) return;
  const min = +S.data.settings.autolock;
  if (min > 0 && Date.now() - S.lastAct > min * 60000) { lock(`Сейф заперт: ${min} мин без действий.`); return; }
  if (S.dirty && S.offline && !S.saving) save();
  else if (!S.dirty && document.visibilityState === 'visible' && Date.now() - S.lastSync > 60000) syncRemote();
}, 15000);

/* ===== старт ===== */
(function start() {
  if (location.hash.startsWith('#connect=')) {
    try {
      const c = JSON.parse(td.decode(unb64url(location.hash.slice(9))));
      if (c && c.r && c.t && c.t.ct) {
        const old = ls.get(CFG_KEY);
        if (!old || old.repo !== c.r) [CACHE_KEY, PENDING_KEY].forEach(ls.del);
        S.cfg = {repo: c.r, path: c.p || VAULT_PATH, tok: c.t}; ls.set(CFG_KEY, S.cfg);
      }
    } catch {}
    history.replaceState(null, '', location.pathname + location.search);
    if (S.cfg) showLock('open', 'Устройство подключено к сейфу. Введите мастер-пароль.');
    else showSetup('Ссылка подключения повреждена. Скопируйте её ещё раз целиком или подключитесь ключом.');
  } else {
    S.cfg = ls.get(CFG_KEY);
    if (S.cfg && S.cfg.repo && S.cfg.tok) showLock('open'); else { S.cfg = null; showSetup(); }
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
